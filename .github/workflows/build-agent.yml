name: Build Windows Agent Installer

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test agent
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @pc-remote/shared build

      - name: Run agent tests
        run: pnpm --filter agent test

  build:
    name: Build Windows Agent Installer
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @pc-remote/shared build

      - name: Bundle agent with esbuild
        run: pnpm --filter agent bundle

      - name: Package agent with pkg
        run: pnpm --filter agent package:win

      - name: Download WinSW
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path installer/winsw
          Invoke-WebRequest `
            -Uri "https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe" `
            -OutFile "installer/winsw/winsw.exe"

      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/installer.iss
          options: /O+

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pc-remote-agent-setup
          path: installer/output/pc-remote-agent-setup.exe
          retention-days: 30

      - name: Calculate SHA256 & Update Winget Manifest
        shell: powershell
        run: |
          $exePath = "installer/output/pc-remote-agent-setup.exe"
          $hash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          $version = if ($tagVersion -and $tagVersion -match '^\d+\.\d+\.\d+') { $tagVersion } else { "0.0.2" }
          
          Write-Host "Installer SHA256: $hash"
          Write-Host "Target Version:   $version"

          $manifestPath = "manifests/Hobbs1210.PCRemoteAgent.yaml"
          if (Test-Path $manifestPath) {
            $content = Get-Content $manifestPath -Raw
            $content = $content -replace 'PackageVersion: .*', "PackageVersion: $version"
            $content = $content -replace 'InstallerUrl: .*', "InstallerUrl: https://github.com/Hobbs1210/pc-remote/releases/download/v$version/pc-remote-agent-setup.exe"
            $content = $content -replace 'InstallerSha256: .*', "InstallerSha256: $hash"
            Set-Content -Path $manifestPath -Value $content -NoNewline
            Write-Host "Updated Winget manifest $manifestPath"
          }

      - name: Commit updated manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/Hobbs1210.PCRemoteAgent.yaml
          git commit -m "chore(release): update winget manifest SHA256 & version for ${{ github.ref_name }}" || exit 0
          git push origin HEAD:main

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/output/pc-remote-agent-setup.exe
            manifests/Hobbs1210.PCRemoteAgent.yaml
          generate_release_notes: true

