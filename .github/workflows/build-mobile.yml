name: Build Mobile Android APK

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @pc-remote/shared build

      - name: Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          patch-watchers: true

      - name: Typecheck mobile
        run: pnpm --filter mobile typecheck

      - name: Build APK with EAS (preview)
        if: ${{ env.EXPO_TOKEN != '' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cd apps/mobile
          eas build --platform android --profile preview --non-interactive

      - name: Build APK with Local Gradle (No EXPO_TOKEN required)
        if: ${{ env.EXPO_TOKEN == '' }}
        run: |
          cd apps/mobile
          npx expo prebuild --platform android --clean
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign & Verify Android APK (V1/V2/V3 Signatures)
        run: |
          mkdir -p apps/mobile/output
          cd apps/mobile/android/app/build/outputs/apk/release
          keytool -genkeypair -v -keystore release.keystore -storepass androidpass -alias pcremote -keypass androidpass -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PC Remote,O=PC Remote,C=US"
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:androidpass --key-pass pass:androidpass --out pc-remote-mobile.apk app-release.apk
          $BUILD_TOOLS_DIR/apksigner verify --verbose pc-remote-mobile.apk
          cp pc-remote-mobile.apk ../../../../../../output/pc-remote-mobile.apk

      - name: Upload mobile build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pc-remote-mobile-app
          path: |
            apps/mobile/output/pc-remote-mobile.apk
            apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/mobile/output/pc-remote-mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
