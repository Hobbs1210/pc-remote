services:
  postgres:
    image: postgres:16.3-alpine
    container_name: pc-remote-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pcremote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pcremote}
      POSTGRES_DB: ${POSTGRES_DB:-pc_remote}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pcremote} -d ${POSTGRES_DB:-pc_remote}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pc-remote-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY:-hobbs1210/pc-remote}/backend:latest
    container_name: pc-remote-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3300}:3300"
    environment:
      NODE_ENV: production
      PORT: 3300
      DATABASE_URL: postgresql://${POSTGRES_USER:-pcremote}:${POSTGRES_PASSWORD:-pcremote}@postgres:5432/${POSTGRES_DB:-pc_remote}
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret-min-32-chars-long}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-refresh-secret-min-32-chars}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3300/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - pc-remote-net

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        SERVER_URL: ${SERVER_URL:-http://localhost:3300}
    image: ghcr.io/${GITHUB_REPOSITORY:-hobbs1210/pc-remote}/web:latest
    container_name: pc-remote-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8877}:80"
    environment:
      SERVER_URL: ${SERVER_URL:-http://localhost:3300}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pc-remote-net

volumes:
  postgres_data:

networks:
  pc-remote-net:
